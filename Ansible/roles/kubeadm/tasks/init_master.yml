---
- name: Initialiser le control-plane
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --apiserver-cert-extra-sans={{ ansible_host }},{{ private_ip_address }}
  args:
    creates: /etc/kubernetes/admin.conf

- name: Dossier .kube de l'utilisateur d'administration
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Copier le kubeconfig pour l'utilisateur
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Confort shell (alias k, complétion)
  ansible.builtin.blockinfile:
    path: "/home/{{ ansible_user }}/.bashrc"
    marker: "# {mark} kubectl (Ansible)"
    block: |
      source <(kubectl completion bash)
      alias k=kubectl
      complete -o default -F __start_kubectl k

- name: Installer le CNI Flannel (version épinglée)
  ansible.builtin.command: "kubectl apply -f https://github.com/flannel-io/flannel/releases/download/{{ flannel_version }}/kube-flannel.yml"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: flannel_apply
  changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"

- name: Générer la commande de jonction (jeton valable 24 h)
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_output
  changed_when: false
  no_log: true

- name: Mémoriser la commande de jonction
  ansible.builtin.set_fact:
    kubeadm_join_cmd: "{{ join_command_output.stdout }}"
  no_log: true
