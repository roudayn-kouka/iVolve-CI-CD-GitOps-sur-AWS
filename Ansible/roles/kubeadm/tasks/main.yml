---
- name: Désactiver le swap (immédiat)
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0
  changed_when: true

- name: Désactiver le swap (permanent)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Modules noyau chargés au démarrage
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Charger les modules noyau
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]

- name: Paramètres sysctl Kubernetes
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
    - net.ipv4.ip_forward

# containerd 2.x (dépôt Docker) : requis à partir de Kubernetes 1.36
- name: Clé du dépôt Docker (pour containerd.io)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Dépôt Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: "Installer containerd (seul runtime nécessaire : pas de Docker Engine sur les nœuds)"
  ansible.builtin.apt:
    name: containerd.io
    state: present
    update_cache: true

- name: "Générer la configuration containerd par défaut (le fichier du paquet désactive le plugin CRI)"
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml && touch /etc/containerd/.ansible-generated
  args:
    creates: /etc/containerd/.ansible-generated
  notify: Restart containerd

- name: Utiliser le cgroup driver systemd (requis par kubelet)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Activer containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Clé du dépôt Kubernetes
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"

- name: Dépôt Kubernetes
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /"
    filename: kubernetes
    state: present

- name: Installer kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name: [kubelet, kubeadm, kubectl]
    state: present
    update_cache: true

- name: Geler les versions (pas de mise à jour accidentelle)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: Activer kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true

- name: Vider les handlers (containerd doit être prêt avant kubeadm)
  ansible.builtin.meta: flush_handlers
