# Nécessite metrics-server (installé par le rôle Ansible k8s_addons).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ivolve-hpa
  namespace: ivolve
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ivolve-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
