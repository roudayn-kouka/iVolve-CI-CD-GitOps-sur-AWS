name: CI — qualité & sécurité

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: App (tests + hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: app
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  terraform:
    name: Terraform (fmt, validate, tfsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: terraform
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

  ansible:
    name: Ansible (yamllint, ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible ansible-lint yamllint boto3
      - run: yamllint -c .yamllint .
        working-directory: Ansible
      - run: ansible-lint playbooks roles
        working-directory: Ansible

  kubernetes:
    name: Manifestes (kustomize + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer kustomize et kubeconform
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
      - run: ./kustomize build k8s-manifests | ./kubeconform -strict -summary
